# Render Blueprint — StoryBook Storefront server + Postgres.
#
# This file is read by Render only after you connect this repo via the
# Render dashboard ("New > Blueprint"). It does nothing until then.
# See docs/deploy-spike-render.md for the full click-by-click.
#
# Free plan caveats (read these before clicking deploy):
#   - Web service spins down after 15 min idle. Cold-start ~30s on wake.
#   - Web service filesystem is ephemeral. Runtime-generated illustration
#     PNGs are LOST on next deploy or restart. Committed demo-seed PNGs
#     in server/public/illustrations/ ship inside the deploy bundle and
#     survive. Long-term fix: blob storage (R2/S3/Cloudinary).
#   - Free Postgres expires after 90 days; upgrade to a paid plan ($7/mo
#     at time of writing) before that to keep your data.

services:
  - type: web
    name: storybook-server
    runtime: node
    plan: free
    region: oregon
    # SINGLE INSTANCE IS LOAD-BEARING (ADR-018). server/src/middleware/rateLimit.ts
    # keeps its counters in a Map in one process, so one instance is the whole fleet.
    # Adding `numInstances: 2` here — or scaling in the Render dashboard — multiplies
    # every rate limit by the instance count, silently: no error, no log, nothing in
    # the response. server/src/__tests__/rateLimitScope.test.ts fails CI if this file
    # declares more than one; the dashboard path is only caught if you also set
    # RATE_LIMIT_INSTANCE_COUNT. Move the counter to a shared store before scaling.
    # Build notes:
    # - --include=dev is required because the server runs TypeScript at
    #   runtime via tsx (a devDep); without this, Render's build-time
    #   NODE_ENV=production omits devDeps and the server fails to start.
    # - The cd + prisma commands MUST chain with && on a single logical
    #   line. Render runs the literal block as one bash script and shell
    #   state persists across lines — splitting the cd into separate
    #   lines causes the second cd to fail with "cd: server: No such
    #   file or directory" because we're already inside server/.
    # - The seed (prisma/seed.ts) is upsert-only: it inserts/updates 6 demo
    #   books keyed by slug ids and is idempotent, so it re-runs harmlessly on
    #   every deploy. It does NOT touch user-created books (uuid ids). NOTE:
    #   because it upserts, a manual edit to one of these 6 demo books in prod
    #   would be overwritten on the next deploy.
    buildCommand: |
      npm ci --include=dev
      cd server && npx prisma generate --schema=prisma/schema.postgresql.prisma && npx prisma db push --schema=prisma/schema.postgresql.prisma --skip-generate --accept-data-loss && npx tsx prisma/seed.ts
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Default image provider is Fal (IMAGE_PROVIDER||'fal'); the Fal provider
      # reads FAL_KEY. Without it set in the Render dashboard, illustration and
      # IV2 character-portrait generation 501s. sync:false = set the value
      # manually in Render (Environment tab), same as the keys above.
      - key: FAL_KEY
        sync: false
      # Seeds the registration allowlist (F4a / #5) on first start, so the
      # deployment isn't locked out of its own signup. Only applies while the
      # AllowedEmail table is empty; after that, manage it in the admin UI.
      - key: ALLOWLIST_BOOTSTRAP_EMAILS
        sync: false
      # Grants role:'admin' to ALREADY-REGISTERED users at server start
      # (server/src/services/adminBootstrap.ts). Comma-separated.
      #
      # UNLIKE the allowlist bootstrap above, this reconciles on EVERY boot:
      # the var is the source of truth, so removing an address DEMOTES that
      # admin on the next restart, and an admin promoted by hand (psql, or a
      # local demo-seed.ts run) is demoted too. That is deliberate — revoking
      # admin has to be an env edit, never a code deploy.
      #
      # Unset, blank, or unparseable (`,,`) = total no-op, so a fat-fingered
      # dashboard edit cannot mass-demote. Because that makes "clear the var"
      # inert, reaching ZERO admins takes the literal value `none` — that is
      # the lever for going live with no standing admin access.
      #
      # Never creates a user and never holds a password: list the address,
      # have them register normally, then restart. A listed address still
      # needs an ALLOWLIST entry to register in the first place — the two vars
      # are independent.
      - key: ADMIN_BOOTSTRAP_EMAILS
        sync: false
      # Locks Access-Control-Allow-Origin to the deployed client instead of
      # the wide-open `*` this service shipped with. This is the ORIGIN only
      # — scheme + host. The /storybook/ path the Pages project site serves
      # under is NOT part of an origin, so don't append it. Comma-separate to
      # allow more than one (e.g. adding a custom domain later). Leaving this
      # unset keeps every origin allowed and logs a warning at startup rather
      # than failing the boot.
      - key: CORS_ORIGIN
        value: https://slickg0ose.github.io
      # Spend ceilings (F4b / #6), in whole cents. Daily is per-user and
      # admin-bypassable; monthly is global and bypassable by nobody.
      - key: QUOTA_DAILY_PER_USER_CENTS
        value: '50'
      - key: QUOTA_MONTHLY_GLOBAL_CENTS
        value: '2000'
      - key: DATABASE_URL
        fromDatabase:
          name: storybook-postgres
          property: connectionString

databases:
  - name: storybook-postgres
    plan: free
    databaseName: storybook
    user: storybook_admin
