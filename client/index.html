<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StoryBook — AI children's books</title>
    <meta
      name="description"
      content="Illustrated children's books written by AI. Browse the collection, or create a one-of-a-kind story with your child in it."
    />
    <meta name="theme-color" content="#fffbf0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)" />

    <!-- The 📚 emoji data-URI that used to sit here shadowed the real mark in public/. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Self-hosted fonts (#126). Preloaded here, not merely declared in index.css: an
      @font-face fetch cannot start until the stylesheet has downloaded and parsed, so a
      preload during HTML parse is the whole point of moving off the Google @import.

      Only the two latin faces. latin-ext is left to its unicode-range, which keeps it
      unfetched unless a page actually renders those codepoints — preloading it would
      spend 40 KB on nothing for almost every visitor.

      `crossorigin` is required even same-origin: fonts are always fetched in CORS mode,
      and without it the preload is discarded and re-requested, which is worse than none.
    -->
    <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="StoryBook — AI children's books" />
    <meta
      property="og:description"
      content="Illustrated children's books written by AI. Browse the collection, or create a one-of-a-kind story with your child in it."
    />
    <!-- Vite rewrites meta[content] for the Pages base path, so this resolves under
         /storybook/ too. It is still root-relative rather than absolute; scrapers that
         require a full URL are tracked separately. -->
    <meta property="og:image" content="/icons/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
