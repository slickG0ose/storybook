<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>StoryBook — AI children's books</title>
    <meta
      name="description"
      content="Illustrated children's books written by AI. Browse the collection, or create a one-of-a-kind story with your child in it."
    />
    <meta name="theme-color" content="#fffbf0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1714" media="(prefers-color-scheme: dark)" />

    <!-- The 📚 emoji data-URI that used to sit here shadowed the real mark in public/. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="StoryBook — AI children's books" />
    <meta
      property="og:description"
      content="Illustrated children's books written by AI. Browse the collection, or create a one-of-a-kind story with your child in it."
    />
    <!--
      Root-relative as authored, absolute as built. Vite rewrites meta[content] for the
      Pages base path, and og.config.ts then prepends VITE_PUBLIC_ORIGIN so scrapers that
      refuse to resolve a relative URL get a full one (#120).

      Leave the authored value root-relative. With VITE_PUBLIC_ORIGIN unset — which is the
      case until a canonical origin exists (#77) — this ships exactly as written, which is
      right for the browser even though it is wrong for a scraper. Hard-coding an origin
      here would invent a fact and break the other of the two deploy targets.
    -->
    <meta property="og:image" content="/icons/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
