name: Deploy

on:
  push:
    branches: [master]

# Cancel any in-progress run if a new commit lands on master. Last commit wins.
concurrency:
  group: deploy-master
  cancel-in-progress: true

jobs:
  # Placeholder. Actual deploys happen via:
  #   - Render (server + Postgres) — triggered by Render's GitHub
  #     integration on push to master once the repo is connected via
  #     render.yaml. No workflow logic needed here.
  #   - GitHub Pages (client) — see .github/workflows/deploy-pages.yml.
  # This file exists to keep "Deploy" as a referenceable status check
  # for branch protection. See docs/deploy-spike-render.md for setup.
  placeholder:
    name: Placeholder (deploys driven by Render + deploy-pages.yml)
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Server deploys via Render (render.yaml at repo root)."
          echo "Client deploys via .github/workflows/deploy-pages.yml."
          echo "See docs/deploy-spike-render.md."
