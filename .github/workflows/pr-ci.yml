name: PR CI

on:
  pull_request:
    branches: [master]

# Cancel any in-progress run if a new commit lands on the same PR. Saves
# minutes on rapid pushes and avoids stale red checks blocking merge.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Harness tests (.claude/ schema + references + hook behavior)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # NOTE: a previous job had a second "Resolution snapshot is up to date"
      # step here that ran `npm run audit:resolution && git diff --exit-code`.
      # The vitest suite now covers that check (see
      # .claude/__tests__/references/resolution-snapshot.test.ts), so it
      # fires during `npm test` above — locally too, before push.

  server-tests:
    name: Server tests (vitest + supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm test
        working-directory: server

  client-tests:
    name: Client tests (vitest + RTL) + typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    name: E2E (Playwright)
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run db:seed && npm run db:seed-demo
        working-directory: server
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: e2e
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm test
        working-directory: e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
