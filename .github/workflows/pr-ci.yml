name: PR CI

on:
  pull_request:
    branches: [master]

# Cancel any in-progress run if a new commit lands on the same PR. Saves
# minutes on rapid pushes and avoids stale red checks blocking merge.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Harness tests (guard-bash behavior + resolution snapshot)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      # The schema/reference vitest suites were removed in the 2026-08 harness
      # simplification, and resolution-snapshot.test.ts went with them. That
      # test was the only thing keeping harness-resolution.md from drifting, so
      # the check moves back here as an explicit step — cheaper than a vitest
      # file, and this is what CI is for. Run `npm run audit:resolution` and
      # commit the result if this fails.
      - name: Resolution snapshot is up to date
        run: |
          npm run audit:resolution
          git diff --exit-code docs/conventions/harness-resolution.md

  server-tests:
    name: Server tests (vitest + supertest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: file:./test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm test
        working-directory: server
      # server/ and shared/ have tsconfigs but neither was ever typechecked in
      # CI — only client/ was, so a type error in either could reach master
      # unnoticed. Both run here rather than in a new job because renaming or
      # adding a required check means an admin has to update the `develop-policy`
      # ruleset, which pins checks by job name. Server must follow
      # `prisma generate`: its types depend on the generated client.
      - run: npx tsc --noEmit
        working-directory: server
      - run: npx tsc --noEmit
        working-directory: shared

  client-tests:
    name: Client tests (vitest + RTL) + typecheck + lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test
        working-directory: client
      - run: npx tsc --noEmit
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    name: E2E (Playwright)
    needs: [server-tests, client-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./dev.db
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npm run db:seed && npm run db:seed-demo
        working-directory: server
      # Key the browser cache on the Playwright version actually installed.
      # It used to hash e2e/package-lock.json — but e2e is an npm workspace, so
      # its deps resolve from the ROOT lockfile and nothing ever installs from
      # e2e/package-lock.json. That file sat at 1.60.0 while the root lockfile
      # moved to 1.62.1, so the key never changed on a Playwright bump: CI would
      # restore stale browsers, skip the install because cache-hit was true, and
      # run the new Playwright against binaries it does not recognise.
      - name: Resolve installed Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        working-directory: e2e
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: npm test
        working-directory: e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
