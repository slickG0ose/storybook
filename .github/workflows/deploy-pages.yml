name: Deploy client to GitHub Pages

# Deploys on every push to master that touches the client bundle's inputs,
# so the live site can't fall behind master the way it did for two months
# before #198 (Render already auto-deploys the server on the same push).
# workflow_dispatch stays for redeploying by hand, e.g. after changing the
# VITE_API_BASE_URL secret or VITE_PUBLIC_ORIGIN variable.
#
# Known window: a PR that changes server and client together lands on Pages
# in ~1-2 min while Render takes longer to build, so for a few minutes the
# new client can talk to the old server. Keep wire changes additive
# (server-first) when a PR spans both. See docs/deploy-spike-render.md.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - 'shared/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build client and deploy to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build client
        working-directory: client
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          # GH Pages serves project sites under /<repo>. Match the path
          # Pages serves at: slickg0ose.github.io/storybook/.
          # If you switch to a custom domain or org root, set this to /.
          VITE_BASE_PATH: /storybook/
          # Origin only, no path — og.config.ts fails the build on a value carrying
          # one, because the /storybook/ prefix is applied separately above and
          # including it here would double it. For this deploy target that means
          # exactly `https://slickg0ose.github.io`.
          #
          # Unset is safe and is the current state: og:image then ships root-relative,
          # which is what it did before #120. Set the repo variable once a canonical
          # origin exists (#77) and Open Graph cards start resolving.
          VITE_PUBLIC_ORIGIN: ${{ vars.VITE_PUBLIC_ORIGIN }}
          VITE_APP_COMMIT: ${{ github.sha }}
          # Tester phase: hides book prices, the cart and checkout on the deployed
          # site (client/src/lib/commerce.ts; docs/conventions/client.md
          # §Commerce flag). To bring commerce back, delete this line or set it
          # to 'true' — unset means ON.
          #
          # A literal on purpose, not a repo variable: the flip is then a reviewed
          # PR that shows in history and triggers its own deploy (this file is in
          # the `paths` filter above). A variable would flip without a trace, and
          # deleting it would silently re-expose the cart.
          VITE_COMMERCE_ENABLED: 'false'
        run: npm run build
      # SPA fallback: GitHub Pages has no client-side-router rewrite, so a
      # direct visit or refresh on a deep route (e.g. /storybook/book/<id>)
      # serves 404.html. Making 404.html a copy of index.html lets the bundle
      # boot and the React Router handle the path. Assets resolve because the
      # build emits absolute /storybook/ URLs.
      - name: SPA fallback (404.html = index.html)
        run: cp client/dist/index.html client/dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist
      - id: deployment
        uses: actions/deploy-pages@v5
